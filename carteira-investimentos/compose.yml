services:
  db:
    image: postgres:16-alpine
    container_name: carteira_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carteira
      POSTGRES_PASSWORD: carteira
      POSTGRES_DB: carteira_investimentos
    ports:
      - "5432:5432"
    volumes:
      - carteira_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteira -d carteira_investimentos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  carteira_pgdata:
